# Desarrollo local con hot reload: docker compose -f compose.local.yaml up --watch
name: puentes-local-frontend

services:
  frontend:
    build: { context: ., target: dev }
    ports: ['4200:4200']
    environment:
      API_URL: http://host.docker.internal:8080
    extra_hosts: ['host.docker.internal:host-gateway']
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json
