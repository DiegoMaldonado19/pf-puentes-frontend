# Entornos dev, stage y prod en la EC2. Los valores vienen del .env que escribe el pipeline.
name: puentes-${APP_ENV}-frontend

services:
  frontend:
    image: ${DOCKERHUB_USERNAME}/pf-puentes-frontend:${IMAGE_TAG}
    restart: unless-stopped
    # :? corta el deploy si falta: vacía, Compose publicaría 8443 en un puerto al azar
    ports: ['${HTTPS_PORT:?falta el secreto HTTPS_PORT}:8443']
    # Certificado del host, uno para los tres entornos (scripts/certificado-tls.sh, ADR 0008)
    volumes: ['../../tls/certificates:/etc/nginx/tls:ro']

# La crea el pipeline; ahí vive el backend del mismo entorno
networks:
  default:
    name: puentes-${APP_ENV}
    external: true
