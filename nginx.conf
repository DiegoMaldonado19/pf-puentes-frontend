server {
  listen 8080;
  root /usr/share/nginx/html;

  # DT-DEP-03
  client_max_body_size 25m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resuelve en cada petición: nginx arranca sin backend y sigue su IP tras un redeploy
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:8080;

  # ^~: ninguna ruta de la API cae en las reglas de archivos estáticos
  location ^~ /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con huella (main-XXXXXXXX.js)
  location ~ "-[A-Z0-9]{8}\.\w+$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Sin caché para que la PWA reciba actualizaciones
  location ~ ^/(index\.html|ngsw\.json)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
