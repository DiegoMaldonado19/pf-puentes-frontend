# DT-SEC-10: solo prod publica este puerto (en el 80, compose.prod.yaml) para mandar a https
server {
  listen 8080;
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;
  root /usr/share/nginx/html;

  # DT-DEP-04: los emite y renueva scripts/certificado-tls.sh en el host (ADR 0008)
  ssl_certificate /etc/nginx/tls/pf-puentes.duckdns.org.crt;
  ssl_certificate_key /etc/nginx/tls/pf-puentes.duckdns.org.key;
  # http:// al puerto de https (stage y dev) vuelve como https:// al mismo puerto
  error_page 497 =301 https://$http_host$request_uri;

  # DT-SEC-10 y DT-SEC-11: todos los encabezados de seguridad viven aquí (ADR 0008)
  add_header_inherit merge;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # DT-DEP-03
  client_max_body_size 25m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resuelve en cada petición: nginx arranca sin backend y sigue su IP tras un redeploy
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:8080;
  set $minio http://minio:9000;

  # ^~: ninguna ruta de la API cae en las reglas de archivos estáticos
  location ^~ /api/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Spring Security también los manda; quedan solo los de arriba
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
  }

  # URL firmadas de las fotos (ADR 0013 del backend): la firma incluye el Host, debe llegar igual
  location ^~ /archivos/ {
    limit_except GET {
      deny all;
    }
    proxy_pass $minio;
    proxy_set_header Host $http_host;
    # DT-SEC-12: la query lleva la firma
    access_log off;
  }

  # Archivos con huella (main-XXXXXXXX.js)
  location ~ "-[A-Z0-9]{8}\.\w+$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Sin caché para que la PWA reciba actualizaciones
  location ~ ^/(index\.html|ngsw\.json)$ {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
