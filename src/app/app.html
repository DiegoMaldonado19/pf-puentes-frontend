<a
  href="#contenido"
  class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-50 focus:rounded focus:bg-white focus:p-2"
  >{{ t.saltar }}</a
>
<header class="border-b border-slate-300 bg-slate-900 text-white">
  <nav
    class="mx-auto flex max-w-6xl flex-wrap items-center gap-4 px-4 py-3"
    [attr.aria-label]="t.principal"
  >
    <a routerLink="/" class="font-bold">{{ t.app }}</a>
    <a
      routerLink="/puentes"
      routerLinkActive="underline"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      >{{ t.inventario }}</a
    >
    <a
      routerLink="/puentes/mapa"
      routerLinkActive="underline"
      ariaCurrentWhenActive="page"
      class="hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white"
      >{{ t.mapa }}</a
    >
  </nav>
</header>
<main id="contenido" tabindex="-1">
  <router-outlet />
</main>
