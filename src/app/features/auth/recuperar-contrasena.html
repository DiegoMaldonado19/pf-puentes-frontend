<section class="hvc-auth" aria-labelledby="titulo-recuperar">
  <div class="hvc-auth__card">
    <img src="bridge.png" alt="" class="brand-logo brand-logo--login hvc-auth__marca" />
    <h1 id="titulo-recuperar" class="text-h1">{{ t.titulo }}</h1>

    @if (error()) {
      <p role="alert" [class]="claseAlerta">{{ error() }}</p>
    }

    @if (hecho()) {
      <p role="status" [class]="claseHecho">{{ t.hecho }}</p>
    } @else {
      <form class="mt-4 grid gap-4" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <div class="flex flex-col">
          <label for="correo" class="hvc-label">{{ campos.correo }}</label>
          <input
            id="correo"
            type="email"
            formControlName="correo"
            autocomplete="email"
            maxlength="254"
            [class]="claseCampo"
            [attr.aria-invalid]="campoInvalido()"
            [attr.aria-describedby]="campoInvalido() ? 'error-correo' : null"
          />
          @if (campoInvalido()) {
            <p id="error-correo" class="hvc-error">{{ mensaje() }}</p>
          }
        </div>
        <button type="submit" [class]="claseBoton" [disabled]="enviando()">
          {{ enviando() ? t.enviando : t.accion }}
        </button>
      </form>
    }

    <p class="mt-4">
      <a routerLink="/login" [class]="claseEnlace">{{ login.accion }}</a>
    </p>
  </div>
</section>
