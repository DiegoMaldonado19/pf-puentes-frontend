<section class="hvc-auth" aria-labelledby="titulo-restablecer">
  <div class="hvc-auth__card">
    <img src="bridge.png" alt="" class="brand-logo brand-logo--login hvc-auth__marca" />
    <h1 id="titulo-restablecer" class="text-h1">{{ t.titulo }}</h1>

    @if (error()) {
      <p role="alert" [class]="claseAlerta">{{ error() }}</p>
    }

    @if (hecho()) {
      <div role="status" [class]="claseHecho">
        <p>{{ t.hecho }}</p>
        <a routerLink="/login" [class]="claseEnlace">{{ login.accion }}</a>
      </div>
    } @else if (token) {
      <form class="mt-4 grid gap-4" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
        <div class="flex flex-col">
          <label for="contrasena" class="hvc-label">{{ campos.contrasenaNueva }}</label>
          <input
            id="contrasena"
            type="password"
            formControlName="contrasena"
            autocomplete="new-password"
            [class]="claseCampo"
            [attr.aria-invalid]="campoInvalido('contrasena')"
            [attr.aria-describedby]="campoInvalido('contrasena') ? 'error-contrasena' : null"
          />
          @if (campoInvalido('contrasena')) {
            <p id="error-contrasena" class="hvc-error">{{ mensaje('contrasena') }}</p>
          }
        </div>
        <div class="flex flex-col">
          <label for="confirmar" class="hvc-label">{{ campos.confirmar }}</label>
          <input
            id="confirmar"
            type="password"
            formControlName="confirmar"
            autocomplete="new-password"
            [class]="claseCampo"
            [attr.aria-invalid]="campoInvalido('confirmar')"
            [attr.aria-describedby]="campoInvalido('confirmar') ? 'error-confirmar' : null"
          />
          @if (campoInvalido('confirmar')) {
            <p id="error-confirmar" class="hvc-error">{{ mensaje('confirmar') }}</p>
          }
        </div>
        <button type="submit" [class]="claseBoton" [disabled]="enviando()">
          {{ enviando() ? t.enviando : t.accion }}
        </button>
      </form>
    }
  </div>
</section>
