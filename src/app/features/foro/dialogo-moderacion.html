<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
  <div
    role="dialog"
    aria-modal="true"
    aria-labelledby="titulo-dialogo-moderacion"
    class="w-full max-w-md rounded-lg bg-white p-4 shadow-lg"
    (keydown.escape)="cancelar.emit()"
  >
    <h2 id="titulo-dialogo-moderacion" class="text-lg font-semibold">
      {{ titulo() }}
    </h2>
    <label class="mt-3 block text-sm font-medium" for="motivo-moderacion">{{
      textos.motivo
    }}</label>
    <textarea
      #campoMotivo
      id="motivo-moderacion"
      rows="3"
      class="hvc-input w-full"
      [value]="motivo()"
      [disabled]="enCurso()"
      (input)="cambioMotivo.emit($any($event.target).value)"
    ></textarea>
    @if (errorMotivo(); as errorMotivoTexto) {
      <p role="alert" class="mt-1 text-sm text-red-700">{{ errorMotivoTexto }}</p>
    }
    @if (errorServidor(); as errorModeracion) {
      <p role="alert" class="mt-1 text-sm text-red-700">{{ errorModeracion }}</p>
    }
    <div class="mt-3 flex justify-end gap-3 text-sm">
      <button
        type="button"
        class="rounded px-3 py-1 hover:bg-slate-100 disabled:opacity-50"
        [disabled]="enCurso()"
        (click)="cancelar.emit()"
      >
        {{ textos.cancelar }}
      </button>
      <button
        type="button"
        class="rounded bg-red-700 px-3 py-1 font-medium text-white hover:bg-red-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-red-800 disabled:opacity-50"
        [disabled]="enCurso()"
        (click)="confirmar.emit()"
      >
        {{ textos.confirmar }}
      </button>
    </div>
  </div>
</div>
